<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>8th Floor Directions</title>
  <link rel="icon" href="/static/christ-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/go.css">
  <!-- the 3D walkthrough (floor3d.js) imports Three.js by these names -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body class="go">
  <header class="go-head">
    <img class="go-logo" src="/static/christ-logo.png" alt="CHRIST (Deemed to be University)">
    <div>
      <p class="kicker">Central Block · 8th floor</p>
      <h1>Find your way</h1>
    </div>
  </header>

  <label class="go-from">
    <span>You are at</span>
    <select id="from" aria-label="Where you are now"></select>
  </label>

  <!-- 1. Where to? -->
  <main id="pick" class="go-pick">
    <div class="go-quick">
      <button class="btn btn-line" type="button" data-nearest="ladies">Ladies washroom</button>
      <button class="btn btn-line" type="button" data-nearest="gents">Gents washroom</button>
      <button class="btn btn-line" type="button" data-nearest="lift">Nearest lift</button>
      <button class="btn btn-line" type="button" data-nearest="way-down">Way down</button>
      <button class="btn btn-line" type="button" data-nearest="water">Drinking water</button>
    </div>
    <input id="search" class="go-search" type="search" placeholder="Room number, person or place"
           aria-label="Search a room number, a person or a place" autocomplete="off">
    <div id="list" class="go-list"></div>
    <div class="map go-overview" id="overview" role="img" aria-label="Map of the 8th floor"></div>
  </main>

  <!-- 2. Step by step -->
  <section id="walk" class="go-walk" hidden aria-label="Walking directions">
    <header class="go-banner">
      <div class="go-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path id="arrow" d=""/></svg></div>
      <div>
        <div class="go-dist" id="dist"></div>
        <div class="go-instr" id="instr" aria-live="polite"></div>
        <div class="go-then" id="then"></div>
      </div>
    </header>
    <div class="go-mapbox">
      <div class="map go-map" id="map" role="img" aria-label="Map of the route"></div>
      <div class="go-map3d" id="map3d" hidden aria-label="3D view of the route: drag to turn, pinch to zoom"></div>
      <button id="dim" class="go-dim" type="button" aria-pressed="false">2D map</button>
    </div>
    <figure class="go-photo" id="photo-box">
      <img id="photo" alt="">
      <figcaption id="photo-cap"></figcaption>
    </figure>
    <div class="go-progress" id="progress"></div>
    <footer class="go-controls">
      <button id="prev" class="btn btn-line" type="button">&#8249; Back</button>
      <button id="say" class="btn btn-line" type="button" aria-label="Read this step aloud">&#128266;</button>
      <button id="next" class="btn btn-navy" type="button">Next &#8250;</button>
    </footer>
    <button id="again" class="go-again" type="button">Choose another place</button>
  </section>

  <footer class="go-foot">Directions from the department's floor plan; distances are approximate.
    If you are lost, the AI receptionist kiosk is in the north corridor, outside the Faculty Staff Room.</footer>

  <script src="/static/map.js"></script>
  <script src="/static/go.js"></script>
</body>
</html>

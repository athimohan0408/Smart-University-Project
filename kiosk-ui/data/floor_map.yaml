# Central Block, 8th floor (Department of Computer Science): map data for the kiosk screen and route finder.
#
# Sources (November 2026):
# - the department's "8th Floor Layout Plan" board on the floor: outer rooms (808-815, 811 MCA Lab), washrooms,
#   water dispensers, lifts, staircases, CCD, Faculty Lounge, the Faculty Staff Room and the open hall. The board says "Not to scale".
# - the kiosk's own position (marked by the team on this map): in the north corridor, outside the middle of the
#   staff room's south wall, its screen facing the hall, so a visitor using it faces north; and the only three
#   ways into the staff room, all open passages in its south side: by room 890, between 888 and 885, and
#   between 884 and 883 (next to the kiosk). There is no door at the east end.
# - a hand sketch of the inside of the Faculty Staff Room (C816): the faculty cabins 871-885, 888, 890 in two
#   rows with passages. 886, 887 and 889 are not in the sketch and are not drawn.
# Positions follow both drawings; the staff room is drawn taller than on the board so the cabins are readable.
# Still to do before `verified: true`: walk the routes once and confirm the two staff-room doors and the passages.
#
# Coordinates are SVG units in `viewbox` (x to the right = east, y DOWN = south). `metres_per_unit` turns path
# length into "about N m" (rough: the drawings are not to scale). `facing` is the way a visitor at the kiosk faces
# on this map; it decides "turn left / right" in the first step.
#
# nodes:  walkable points. `name` makes a node a landmark the directions mention ("... to the ...").
# edges:  pairs of nodes you can walk between in a straight line.
# places: drawn rectangles. `door` is where a place meets a walkway and `via` the node there; a place with both
#         is a destination (rooms 808-815, the cabins, the lounge). `label_at` moves a label off the middle.


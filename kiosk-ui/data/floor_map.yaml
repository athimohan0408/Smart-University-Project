# starts: where else a visitor can begin a route (the kiosk itself is `start` above). Each lift and staircase
# gets a QR sticker that opens the phone walkthrough at /go?from=<id>. `facing` is the way someone faces with the lift
# (or staircase) behind them, so the first step reads "With the north lift behind you, turn left ...": right whether
# they just stepped out or are reading the sticker. Other places (rooms, water ...) get compass directions instead. The lift doors are ASSUMED to open onto the hall
# walkway (north lift: south; south lift: north) and the west lift onto the west corridor: check on the floor.
starts:
  lift-north: {node: lift_n, name: "the north lift", facing: south, lead: "With the north lift behind you", photo: lifts.jpg}
  lift-south: {node: lift_s, name: "the south lift", facing: north, lead: "With the south lift behind you", photo: lift-south-out.jpg}
  lift-west: {node: w355, name: "the west lift", facing: east, lead: "With the west lift behind you", photo: lift-west.jpg}

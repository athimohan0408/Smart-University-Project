  - {id: "room:882", label: "882", kind: room, rect: [625, 90, 70, 120], door: [660, 215], via: c660}
  - {id: "room:883", label: "883", kind: room, rect: [705, 90, 70, 120], door: [740, 215], via: c740}
  - {id: "room:884", label: "884", kind: room, rect: [785, 90, 70, 120], door: [820, 215], via: c820}
  - {id: "room:885", label: "885", kind: room, rect: [865, 90, 70, 120], door: [900, 215], via: c900}
  # east wing, south side

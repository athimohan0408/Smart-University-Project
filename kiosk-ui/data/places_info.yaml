# What each place on the 8th floor is, for the kiosk's place cards ("Explore the floor", tap a room on the map,
# the phone walkthrough). Keyed by the place id in floor_map.yaml. Only write what the department has confirmed:
# the card shows only the fields that are filled in.
#
#   name           what it is called            about   one or two sentences for visitors
#   hours          opening hours, as written    notes   anything else visitors should know
#   class_teacher  for a classroom              source  where the facts came from
#
# Who sits in a faculty cabin is NOT written here: it comes from rag-core's faculty sheet (faculty.json), with
# what the timetable says about them right now.
#
# Classrooms 808-815: the "Rooms" sheet of rag-core/data/raw/8th_floor_faculty_with_subjects.xlsx
# (class teachers from the PG class timetable, Version 04). They change each semester: update them here.


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiosk-ui"
version = "0.1.0"
description = "Portion 3 (kiosk screen, floor map + navigation, analytics dashboard, evaluation) of the AI receptionist for Central Block 8th floor, CHRIST University"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0",
    "httpx>=0.27",       # keep-alive client for voice-memory's POST /turn
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiosk_ui = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

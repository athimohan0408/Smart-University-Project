# Every tunable for rag_core lives here; code must not hard-code these values.
# Loaded and validated by rag_core.config.Settings. Unknown keys are rejected, so typos fail loudly.
# Relative paths resolve against the repo root. Secrets do NOT go here: use .env (see .env.example).
# Override which file is loaded with the RAG_SETTINGS_PATH env var (e.g. for eval variants).

paths:
  raw_faculty_xlsx: data/raw/8th_floor_faculty_final_data.xlsx
  glossary: data/kb/glossary.yaml           # hand-maintained + versioned; ingest never writes it
  entity_lexicon: data/kb/entity_lexicon.yaml  # facility/event words, honorifics (hand-maintained)
  # Verified classrooms, labs, facilities and events (kb/campus.py). Optional: missing or empty => those
  # questions escalate. Edit, then `just index` or POST /reload-kb; no retraining needed.
  campus_xlsx: data/raw/campus_info.xlsx
  faculty_json: data/processed/faculty.json                 # outputs of `just ingest`
  subject_codes_csv: data/processed/subject_codes_found.csv
  data_quality_report: data/processed/data_quality_report.md
  facts_jsonl: data/index/facts.jsonl       # outputs of `just index`
  chroma_dir: data/index/chroma
  bm25_index: data/index/bm25.pkl
  gazetteer: data/index/gazetteer.json      # entity-linking vocabulary, also written by `just index`
  eval_testset: data/eval/qa_test.jsonl     # end-to-end gold questions with a fixed dev/test split (hand-written, versioned)
  eval_reports_dir: reports                 # `just eval` writes eval_<timestamp>.md/.json + failures.csv here
  eval_baseline: reports/baseline.json      # versioned: the regression test fails if a headline metric drops > eval.max_regression
  confidence_model: data/models/confidence.joblib  # output of `just calibrate`
  calibration_report: reports/calibration.md
  threshold_report: reports/threshold_sweep.md
  query_log: logs/queries.jsonl             # one JSON line per request, for analytics (schema: docs/interface.md)
  intent_train: data/eval/intent_train.jsonl  # labelled seed set: training + CV only
  intent_test: data/eval/intent_test.jsonl    # HELD OUT: never train or tune on it
  intent_model: data/models/intent.joblib     # output of `just train-intent`
  intent_report: reports/intent_eval.md       # output of `just eval-intent`
  entity_test: data/eval/entities_test.jsonl  # gold entities (hand-written); never tune rules on it
  entity_report: reports/entity_eval.md       # output of `just eval-entities`
  retrieval_test: data/eval/retrieval_test.jsonl  # question -> gold fact_ids (hand-written)
  retrieval_report: reports/retrieval_eval.md     # output of `just eval-retrieval`

kb:
  faculty_sheet: "8th Floor Faculty"
  # The receptionist's own location. Faculty rows elsewhere are still answerable,
  # but must be described as "not on this floor" (see CLAUDE.md data quirks).
  home_block: "Central Block"
  home_floor: "Eighth Floor"
  # Classes and consultations happen inside this window. Used ONLY to choose am/pm for a time
  # written without a marker ("1.45" -> 13:45). Must be shorter than 12 h so the choice is unique.
  # Quote the values: unquoted 17:00 is read by YAML as a base-60 integer.
  day_start: "07:30"
  day_end: "17:00"

embeddings:
  model: bge-small   # one-line switch: bge-small | minilm  (then rebuild: `just index`)
  models:
    bge-small:
      name: BAAI/bge-small-en-v1.5
      # bge v1.5 puts this instruction on queries only; passages are embedded as-is.
      query_prefix: "Represent this sentence for searching relevant passages: "
      passage_prefix: ""
    minilm:
      name: sentence-transformers/all-MiniLM-L6-v2
      query_prefix: ""
      passage_prefix: ""
  normalize: true
  batch_size: 32
  device: cpu

vector_store:
  collection: rag_core_kb_v1
  distance: cosine

retrieval:
  top_k: 5               # N: facts the retriever returns and generation sees; also the k in recall@k
  dense_candidates: 20   # per-retriever candidate pool before fusion
  bm25_candidates: 20
  rrf_k: 60              # reciprocal-rank-fusion constant
  bm25_k1: 1.5           # BM25 term-frequency saturation (rank_bm25 default)
  bm25_b: 0.75           # BM25 length normalisation (rank_bm25 default)
  target_recall: 0.95    # Recall@top_k required on paths.retrieval_test for hybrid + structured
  # Fact categories the semantic stage may return, per intent: a Chroma `where` filter, applied to
  # BM25 as well. Structured routing is not filtered. An intent missing here searches every
  # category. An empty list skips semantic search: nothing in the KB can answer that intent.
  # Events and facilities come only from the optional campus sheet; without it their categories hold no facts.
  intent_categories:
    find_person: [faculty_location, faculty_profile, room]
    person_availability: [faculty_consultation, schedule, faculty_location]
    find_by_subject: [course, teaching, faculty_profile, programme]
    find_room: [room, faculty_location, programme, course, facility]
    schedule_query: [schedule, teaching, course]
    programme_info: [programme, course]
    contact_info: [faculty_profile]
    event_info: [event]
    facility_info: [facility]
    greeting: []
    smalltalk_or_thanks: []
    escalate_to_human: []
    out_of_scope: []
  rerank:
    enabled: false       # cross-encoder pass over the candidates; measured in reports/retrieval_eval.md
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 20       # structured + fused candidates the cross-encoder scores (>= top_k)
    batch_size: 32
    device: cpu

intent:
  # Logistic regression on the question's query embedding (same Embedder + prefix as retrieval,
  # so the pipeline embeds each question once). Retrain only when intents or the embedding model change.
  c_grid: [1, 5, 10, 20, 50, 100, 200, 500, 1000]  # inverse regularisation; chosen by CV on the TRAIN set only
  cv_folds: 5
  max_iter: 5000
  class_weight: balanced    # balanced | null
  seed: 13
  top_n: 3                  # size of the returned distribution
  rule_confidence: 0.98     # probability given to an unambiguous rule match (greeting, thanks, human)
  # Optional LLM second opinion when the classifier is unsure. Off by default: no API key is
  # configured yet, and accuracy must be reportable with and without it.
  llm_fallback_enabled: false
  llm_fallback_threshold: 0.5   # ask the LLM when the top probability is below this
  llm_fallback_confidence: 0.7  # probability reported for an intent chosen by the LLM
  target_accuracy: 0.90         # held-out accuracy required without the LLM fallback

entities:
  # Gazetteer + fuzzy entity linking (rag_core.nlu.entities). The fuzzy cut-off is
  # thresholds.entity_match_min.
  max_span_tokens: 8        # longest word span compared with an alias: the longest programme name is 6 words, plus "in"/"of"
  fuzzy_min_chars: 4        # spans and aliases shorter than this (letters, no spaces) match exactly only
  # A fuzzy match also needs every content word on both sides to have a counterpart scoring at least
  # this (rapidfuzz ratio), or token_set_ratio lets shared words carry it: "c programming" would
  # match "programming fundamentals" at 92. 70 keeps one-word typos ("singh" ~ "singhal" is 83).
  fuzzy_word_min: 70
  ambiguity_margin: 3       # rapidfuzz points: candidates this close to the best are ALL returned, flagged ambiguous
  short_code_score: 0.9     # timetable short codes ("SU", "DVJ") collide with words, so never full confidence
  unknown_name_score: 0.5   # "Dr <name not in the KB>": recognised as a person, not linked
  target_f1: 0.90           # micro F1 required on paths.entity_test
  # Named periods -> time ranges. PROVISIONAL: the source data records no lunch break or period
  # boundaries; confirm with the department. Must lie inside kb.day_start..kb.day_end.
  periods:
    morning: ["07:30", "12:00"]
    afternoon: ["12:00", "17:00"]
    evening: ["16:00", "17:00"]
    noon: ["12:00", "12:00"]
    lunch: ["12:45", "13:45"]   # "after lunch" = lunch end .. day_end; "before lunch" = day_start .. lunch start

facts:
  # Write unverified-but-expanded glossary names into fact text, marked as not verified
  # (e.g. 'subject code ML ("Machine Learning", full name not verified)'). false = code only.
  include_unverified_expansions: true

thresholds:
  entity_match_min: 85         # rapidfuzz score (0-100) to link a mention to a KB entity
  intent_min_confidence: 0.55  # final intent probability below this => clarify or escalate
  # Best dense cosine similarity below this => nothing relevant. PROVISIONAL: bge-small scores
  # cluster around 0.6-0.8 even for weak matches, so calibrate this on the eval set.
  retrieval_min_similarity: 0.35
  # Final confidence below this => escalate (LOW_CONFIDENCE). 0.45 = reports/threshold_sweep.md pick on the
  # QA dev split (highest coverage with hallucination <= 2%). Re-run `just calibrate` after model/data changes.
  answer_min_confidence: 0.45
  # Confidence multiplier when an answer relies on a glossary expansion with verified: false
  # (a "TODO" expansion is never used at all). See rag_core.kb.glossary.confidence_weight.
  unverified_glossary_weight: 0.5

llm:
  provider: anthropic   # anthropic | openai | ollama  (install the matching extra: pip install -e .[anthropic])
  model: claude-opus-5-5
  temperature: 0.0      # sent to openai/ollama; current Claude models reject sampling params, so not sent there
  effort: low           # anthropic output_config.effort: low | medium | high. Short rephrasing needs little thinking
  anthropic_fallbacks: true  # server-side refusal fallback (beta server-side-fallback-2026-07-01, fallbacks: default)
  # Thinking tokens count against this on current Claude models, so it is well above the 1-3 sentence answer.
  max_tokens: 2048
  timeout_s: 15         # per attempt; on timeout the pipeline answers from templates or escalates
  max_retries: 1        # transport retries (timeouts, 429, 5xx). Invalid JSON gets its own single retry
  # USD per million tokens, used ONLY to report the cost of validation/eval runs (never for behaviour).
  # claude-opus-5-5 list price as of 2026-10; update when the model or price changes.
  price_input_per_mtok: 4.0
  price_output_per_mtok: 20.0

generation:
  # llm: answer with the LLM, falling back to templates when it is down or times out.
  # template: never call the LLM (deterministic; what tests and the offline eval use).
  mode: llm
  max_names_spoken: 3        # longer lists are cut to this many names + "and N others"
  max_clarification_options: 3
  # Exactly what the visitor hears when an answer can't be verified (and on GROUNDING_FAILED).
  safe_message: "I'm sorry, I can't verify that. Please check with the receptionist at the desk."

scoring:
  # Transparent confidence = weighted sum of features in [0, 1]; the weights must sum to 1.
  # Then x unverified_fact_weight if a cited fact has verified=False (conflict caution, unreadable
  # hours, unverified code name), and x thresholds.unverified_glossary_weight if the ANSWER uses an
  # unverified glossary expansion ("Machine Learning" for ML). Saying the code costs nothing.
  weights:
    intent: 0.20       # intent probability
    entity: 0.20       # min link score over the KB entities in the question (0 if the intent needs one and none linked)
    retrieval: 0.10    # top-1 retrieval score
    margin: 0.05       # top-1 minus top-2 retrieval score
    structured: 0.15   # 1 if a cited fact came from structured routing (exact KB-id match)
    answerable: 0.15   # the generator's answerable flag
    grounded: 0.15     # the grounding check passed
  unverified_fact_weight: 0.85
  # `just calibrate` fits a logistic regression (features -> answer was correct) on the QA DEV split.
  # When the artifact exists and this is true, confidence is its calibrated probability.
  use_calibration: true
  # A calibrator fitted on fewer wrong dev answers than this learns the base rate, not the signals:
  # `just calibrate` then keeps the weighted formula and deletes any old artifact.
  min_negatives_for_calibration: 10
  calibration_bins: 10        # bins for the expected calibration error (ECE)
  # Threshold sweep (`just calibrate`): the escalation threshold with the highest coverage whose
  # hallucination rate among answered DEV questions stays at or below this.
  max_hallucination_rate: 0.02
  sweep_step: 0.05
  nli:
    enabled: false   # optional NLI check of answer sentences against the cited facts (downloads the model)
    model: cross-encoder/nli-deberta-v3-small
    max_contradiction: 0.5   # a sentence whose contradiction probability exceeds this fails grounding
    device: cpu

eval:
  recall_at: [1, 3, 5]
  # Clock for QA questions without their own "now" (a Tuesday mid-morning), so runs are reproducible.
  default_now: "2026-10-20T11:00:00"
  # The regression test fails when a headline metric is worse than reports/baseline.json by more than this.
  max_regression: 0.02
  calibration_c: 1.0   # inverse regularisation of the confidence calibrator (dev split is small)

api:
  host: 127.0.0.1
  port: 8000

# Glossary of programme and subject codes used in the faculty timetable.
#
# HAND-MAINTAINED. `just ingest` never writes this file; it lists codes missing from it in
# data/processed/data_quality_report.md (section "Glossary coverage").
#
# Rules (enforced in rag_core.kb.glossary):
#   full_name: TODO   -> no expansion known. Answers must use the code as written, never a guess.
#   verified: false   -> expansion may be used, but answers relying on it get lower confidence
#                        (thresholds.unverified_glossary_weight in config/settings.yaml).
#   verified: true    -> confirmed by the department. Only set this after confirmation.
#
# Keys are the codes exactly as they appear in the timetable.
#
# SUBJECTS come from the department's dataset (data/raw/8th_floor_faculty_with_subjects.xlsx, sheet "Subject Codes",
# rows with Status "Done"): `just sync-glossary` copies their full forms here as verified: true. Edit the sheet,
# not these lines, then sync and `just index`. A test fails when this file and the sheet disagree.
# PROGRAMMES are not in that sheet and are still unverified.

programmes:
  BCA:
    full_name: Bachelor of Computer Applications
    aliases: []
    verified: false
  BSC:
    full_name: Bachelor of Science
    aliases: [BSc]
    verified: false
  MCA:
    full_name: Master of Computer Applications
    aliases: []
    verified: false
  MSAIM:
    full_name: MSc Artificial Intelligence and Machine Learning
    # "MSc AIML" is the spelling in the sheet's Programmes Taught column; "MSc AI and ML" is the
    # problem statement's; bare "AIML" is how visitors say it. Linking them to MSAIM is an
    # inference until verified.
    aliases: [MSc AIML, MSc AI and ML, AIML]
    verified: false
  MSC:
    # Only seen in "MSC CSA" (Dr Sandeep J, Saturday); the sheet's notes call it a separate block.
    full_name: TODO
    aliases: []
    verified: false

